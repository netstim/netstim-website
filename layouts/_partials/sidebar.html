<aside class="sidebar" aria-label="Related pages and latest updates">
  {{ with .Params.related }}
    <nav class="related" aria-label="Related pages">
      <ul>{{ range . }}
        {{ $href := partial "url.html" .url }}
        <li><a href="{{ $href }}"{{ if eq $href $.RelPermalink }} aria-current="page"{{ end }}>{{ .title }}</a></li>
      {{ end }}</ul>
    </nav>
  {{ end }}
  <section class="latest-updates" aria-labelledby="latest-updates-title">
    <h2 id="latest-updates-title">Latest Updates</h2>
    <ul>
    {{ range hugo.Data.updates }}
      <li class="update-row">
        <a href="{{ partial "url.html" .url }}">
          {{ partial "picture.html" .image }}
          <span>{{ .title }}<small>{{ .time }}</small></span>
        </a>
      </li>
    {{ end }}
    </ul>
  </section>
</aside>
