<div class="title-band">
  <div class="wrap title-inner">
    <h1>{{ .Title }}</h1>
    {{ with .Params.crumbs }}
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <span>You are here:</span>
        <ol>
          {{ range $i, $crumb := . }}
            <li>{{ if $i }}<span aria-hidden="true">/</span>{{ end }}
              {{ if $crumb.url }}<a href="{{ partial "url.html" $crumb.url }}">{{ $crumb.title }}</a>
              {{ else }}<span aria-current="page">{{ $crumb.title }}</span>{{ end }}
            </li>
          {{ end }}
        </ol>
      </nav>
    {{ end }}
  </div>
</div>
