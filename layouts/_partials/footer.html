<footer class="site-footer">
  <div class="wrap">
    <nav aria-label="Legal">
      {{ range $i, $link := hugo.Data.nav.footer }}
        {{ if $i }}<span aria-hidden="true">|</span>{{ end }}
        <a href="{{ partial "url.html" $link.url }}">{{ $link.title }}</a>
      {{ end }}
    </nav>
  </div>
</footer>
