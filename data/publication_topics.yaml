# Topics of the papers on the Publications page (the filter chips above the list).
# data/publications.yaml is synced from Zotero and holds no topics, so they are kept here, by Zotero key.
#
# To tag a new paper: copy its `key` from data/publications.yaml and add a line
#   KEY: [topic, topic]   # a few words of the title, for the next reader
# under its year. A paper may have several topics. A paper that fits none gets no line and shows
# only under "All". If Zotero holds a paper twice (preprint and article), tag both keys alike.
#
# The topics (anything else stops the build):
#   dbs             deep brain stimulation
#   connectomes     normative or patient connectomes, network mapping, tractography, fiber filtering
#   lead-dbs        the Lead-DBS toolbox, its tools and methods
#   tms             transcranial magnetic stimulation
#   lesion-mapping  lesion network mapping and other lesion studies

