  title: High-resolution brain atlas for deep brain stimulation imaging
  image:
    src: media/ef0e1a1c96dd-Mesoscale_Poster_HF_final_wtract-1536x1152.jpeg
    original: https://www.netstim.org/wp-content/uploads/2023/10/Mesoscale_Poster_HF_final_wtract-1030x773.jpeg
    alt: ''
    width: 1030
  full: '@root@wp-content/uploads/2023/10/Mesoscale_Poster_HF_final_wtract-1030x773.jpeg'
  details: '<div title="Page 1">




    <h2>High-resolution brain atlas for deep brain stimulation imaging</h2>







    <p><a href="@root@wp-content/uploads/2023/10/Mesoscale_Poster_HF_final_wtract.pdf">Poster PDF</a></p>

    <h3>Mesoscale Brain Mapping Symposium 2023 | Poster Abstract</h3>

    <h3>A High Resolution Brain Atlas for Deep Brain Stimulation Imaging</h3>

    <p>Helen Friedrich<sup>1,2</sup>, Simon Oxenford<sup>3</sup>, Eduardo J. L. Alho<sup>4</sup>, Brian L. Edlow<sup>5,6</sup>, Clemens Neudorfer<sup>1,3,7</sup>, Andreas Horn<sup>1,3,5,7</sup></p>

    <p>Contact: hfriedrich@bwh.harvard.edu; ahorn1@bwh.harvard.edu</p>

    <p><sup>1 </sup>Center for Brain Circuit Therapeutics Department of Neurology Brigham &amp; Women’s Hospital, Harvard Medical School, Boston MA 02115, USA</p>

    <p><sup>2 </sup>Julius-Maximilian-University Wuerzburg, Germany</p>

    <p><sup>3 </sup>Movement Disorder and Neuromodulation Unit, Department of Neurology, Charité – Universitätsmedizin Berlin, corporate member of Freie Universität Berlin and Humboldt- Universität zu Berlin,
    Department of Neurology, 10117 Berlin, Germany</p>

    <p><sup>4</sup> Clinic of Pain and Functional Neurosurgery, São Paulo, Brazil</p>

    <p><sup>5 </sup>Center for Neurotechnology and Neurorecovery, Department of Neurology, Massachusetts General Hospital, Boston, MA 02114, USA</p>

    <p><sup>6 </sup>Athinoula A. Martinos Center for Biomedical Imaging, Massachusetts General Hospital, Charlestown, MA, USA</p>

    <p><sup>7 </sup>Brain Modulation Lab, Department of Neurosurgery, Massachusetts General Hospital, Boston, MA, 02114, USA</p>

    <h4>Background</h4>

    <p>The success of deep brain stimulation therapy is defined by the exact placement of electrodes in relation to their targets. Overlaps between stimulation volumes and anatomical structures may account
    for clinical outcomes. To investigate this, precise definitions of anatomical structures are critical. These target structures frequently comprise anatomical structures or tracts that are often not
    discernable on conventional neuroimaging.</p>

    <h5>Methods</h5>

    <p>We aimed to create a high-resolution atlas including both grey and white matter based on a 100-micron ex-vivo MRI brain scan (Edlow et al., 2019). Histological data, postmortem fiber dissections,
    and expert opinions of clinicians and anatomists were used to inform and enrich anatomical validity. Segmentations of gray- (n=15) and white- (n=16) matter structures at the level of the subthalamus
    were carried out on the high resolution MRI scan and converted into MNI ICBM 2009b NLIN ASYM space. This spatial transform from MRI native to template space was carried out using a manually curated
    warpfield that accounts for proper definitions of target structures in standard space.</p>

    <h5>Results &amp; Conclusions</h5>

    <p>The main result of this work should be seen in a high-resolution atlas of the human subthalamus comprising a total of 31 gray and white matter regions per hemisphere. Together with the ex-vivo MRI
    template and a precise manual registration to MNI space, this dataset is deformable to patient MRIs and can be readily applied in DBS imaging studies.</p>'
