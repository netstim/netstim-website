    <div class="columns"><div class="column column-3-4"><h2>Frauke Raaff</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Frauke joined the NetStim Lab in 2026 as the administrative executive, working at Uniklinik Köln. She holds a Bachelor of Arts in Literary and Linguistic Studies from RWTH Aachen University and is also a Certified Foreign Language Correspondent in English. After working as a research assistant at RWTH centralized Biomaterial Bank Aachen and Schneider C. Lab (Gastroenterology) at Uniklinik Aachen for almost 3,5 years and completing interdisciplinary modules in Neurolinguistics and Neuropsychology as part of her course of studies, she is looking forward to the upcoming years at NetStim Lab.</p>
    <p>When Frauke is not busy writing e-mails and maintaining office operations, she enjoys reading a good book, exploring the outdoors with her dog Nils – a Corgi-Jack Russell Terrier Mix – and learning new languages. Recently, she is trying to pick up Italian again, which she started learning back in High School. If you want to really get her talking, ask her about Doctor Who. She’s been a Whovian for nearly two decades and it’s her comfort show.</p>
    </div></div>

    <div class="columns"><div class="column column-1-3"><article class="icon-box"><header aria-label="Icon: LinkedIn"><a aria-label="LinkedIn" class="icon-link" href="https://de.linkedin.com/in/frauke-raaff-8882a6226" rel="noopener noreferrer" target="_blank" title="LinkedIn"></a><h3 class="icon-heading"><a href="https://de.linkedin.com/in/frauke-raaff-8882a6226" rel="noopener noreferrer" target="_blank" title="LinkedIn">LinkedIn</a></h3></header></article></div></div>
- mode: wide
  body: |-
    <div class="columns"><div class="column column-3-4"><h2>Lara Krüger</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Lara joined the NetStim lab in March 2026 for a research rotation and her Master’s thesis as part of her M.Sc. in Clinical and Experimental Neurosciences at the University of Cologne. She previously obtained her Bachelor’s degree in Psychology (cum laude) from Radboud University in the Netherlands.<br/>Her research interests lie in neurological and psychiatric disorders and how neural networks differ between healthy and pathological states. She plans to pursue a PhD in Neuroscience, after completing her Master’s degree.<br/>In her free time, she can often be found (not entirely successfully) trying to relearn French, enjoying dinner parties with friends, or watching handball. She enjoys exploring new sports places and appreciates a good espresso – occasionally in the form of an espresso martini.</p>
    </div><div class="column column-1-4">
    <div class="image-block"><netstim-image data='{"src":"media/db52efc3eae3-a49406be-7492-426b-b5e8-0415cc9b85a5-1536x1022.jpg","original":"https://www.netstim.org/wp-content/uploads/2026/04/a49406be-7492-426b-b5e8-0415cc9b85a5-300x200.jpg","alt":"","width":300}'/></div></div></div>
- mode: wide
  body: |-
    <div class="columns"><div class="column column-3-4"><h2>Richard Demann</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Richard joined the NetStim Lab in November 2025. He is a medical student at the University of Cologne and previously spent time in labs at TU Munich, UCSF, and the Mayo Clinic.<br/>Outside the lab, he enjoys reading, podcasts, and good food, and is slowly being buried by his ever-growing mountain of Anki reviews.</p>
    </div><div class="column column-1-4"><div class="image-block"><netstim-image data='{"src":"media/32a303f35201-IMG_7312-1-1536x1536.jpeg","original":"https://www.netstim.org/wp-content/uploads/2026/05/IMG_7312-1-300x300.jpeg","alt":"","width":300}'/></div></div></div>

    <div class="columns"><div class="column column-1-3"><article class="icon-box"><header aria-label="Icon: LinkedIn"><a aria-label="LinkedIn" class="icon-link" href="https://de.linkedin.com/in/richard-demann-40791b213" rel="noopener noreferrer" target="_blank" title="LinkedIn"></a><h3 class="icon-heading"><a href="https://de.linkedin.com/in/richard-demann-40791b213" rel="noopener noreferrer" target="_blank" title="LinkedIn">LinkedIn</a></h3></header></article></div></div>
- mode: wide
  body: |-
    <div class="columns"><div class="column column-3-4"><h2>Benjamin Selaskowski</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Benjamin joined the NetStim Lab as a postdoctoral researcher in January 2026. He initially studied biomedical engineering for a few semesters before switching to psychology. During the five years he lived in the Netherlands, he completed a Bachelor of Science in Psychology at Radboud University and the Donders Institute in Nijmegen, and a Master of Science at the University of Groningen. He then worked as a neuropsychologist in the Department of Neurology at the University Hospital Göttingen, before moving to the University Hospital Bonn, where he became involved in developing and evaluating digital therapeutic methods for mental disorders and in non-invasive brain stimulation. In 2024, he received his PhD in Medical Psychology from the University of Bonn.</p>
    <p>
    <p>At the Institute for Network Stimulation, his research is supported by DFG funding, giving him the opportunity to focus on his main area of interest, the development of personalized protocols in TMS. He is interested in how individualized brain mapping and circuit dynamics can guide stimulation targeting and improve treatment response.</p>
    <p>
    <p>Benjamin has played tennis since the age of four, competed in teams for years and trained as a coach, though he makes it onto the court only occasionally these days. He also enjoys reading other than scientific articles, or listening to audiobooks and podcasts. He particularly enjoys traveling to France and generally to the sea. Occasionally, he tries to recall his childhood piano lessons, only to give up in frustration.</p>
    </p></p></div><div class="column column-1-4"><div class="image-block"><netstim-image data='{"src":"media/be5aaff15edc-selaskowski_benjamin_netstim.jpeg","original":"https://www.netstim.org/wp-content/uploads/2026/06/selaskowski_benjamin_netstim-240x300.jpeg","alt":"","width":240}'/></div></div></div>

    <div class="columns"><div class="column column-1-3"><article class="icon-box"><header aria-label="Icon: LinkedIn"><a aria-label="LinkedIn" class="icon-link" href="https://de.linkedin.com/in/benjamin-selaskowski" rel="noopener noreferrer" target="_blank" title="LinkedIn"></a><h3 class="icon-heading"><a href="https://de.linkedin.com/in/benjamin-selaskowski" rel="noopener noreferrer" target="_blank" title="LinkedIn">LinkedIn</a></h3></header></article></div></div>
- mode: wide
  body: |-
    <div class="columns"><div class="column column-3-4"><h2>Michael Ferres</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Michael joined the NetStim lab in 2026 as a PhD Student parallel to his training as a children’s psychotherapist at the UKK. He completed his masters degree in psychology at the University of Bonn under Benjamin Selaskowski and joined his project to continue working on connectivity analyses in the context of TMS intervention.<br/>His research interests encompass TMS stimulation targets and possible individualization, TMS treatment effects and identifying lifespan differences in impairment of cognitive control.<br/>Besides his interest in clinical psychology, Michael enjoys football, swimming, playing and crafting the classical guitar and cooking authentic Italian dishes.</p>
    </div></div>
- mode: wide
  body: |-
    <div class="columns"><div class="column column-3-4"><h2>Celine Kölsch</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4">
    <p>Celine joined the NetStim Lab in August 2026, where she supports a clinical study investigating personalized transcranial magnetic stimulation in adults with attention-deficit/hyperactivity disorder. She holds a Bachelor of Science and a Master of Science in Psychology from the University of Trier and is currently completing her training as a psychotherapist in Cologne alongside her research.</p>


    <p>In parallel, Celine is pursuing her PhD at the University of Oldenburg, where her research focuses on the safety, tolerability, and adverse effects of non-invasive brain stimulation in the treatment of mental disorders.</p>


    <p>Despite what her last name might suggest, Celine is not originally from Cologne. She grew up in a small wine village along the Moselle and even served as a wine princess there. Outside of research and clinical work, she enjoys fitness and staying active, travelling, and spending time with friends and family.</p>

    </div></div>
- mode: wide
  body: |-
    <div class="columns"><div class="column column-3-4"><h2>Helen Friedrich</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Helen is an MD student who joined the lab in Boston in April 2023, where she focuses on her MD thesis project aimed at creating a detailed brain atlas for DBS imaging.</p>
    <p>Her journey into medicine began with a foundation in psychology, where her work with neuropsychiatric patients sparked a profound interest in neurology and functional neuroanatomy. This experience led her to explore imaging research with the goal to bridge clinical practice with scientific inquiry. In her bachelor’s thesis, she used fMRI and eye-tracking to probe brain networks involved in social attention.</p>
    <p>Working with neuropsychiatric patients was a key motivator in her decision to transition into medical school. She pursues an additional degree in translational medicine to lay the foundation for a clinician-scientist career. Her favorite topics are anatomy and intensive care medicine.</p>
    <p>Helen is excited to immerse in Boston’s academic environment and is committed to making a meaningful contribution to the field through her atlas project.</p>
    <p>Beyond her interest in the brain, Helen is passionate about interior design and loves spending time in the mountains, either hiking or skiing.</p>
    </div><div class="column column-1-4">
