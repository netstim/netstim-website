    <div class="columns"><div class="column column-3-4"><h2>Jan Philipp Payonk</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Jan Philipp joined the NetStim Lab in 2026 as a postdoctoral researcher in the Department of Functional and Stereotactic Neurosurgery at the Uniklinik Köln. He holds a Bachelor’s and a Master’s degree in Mathematics from the University of Rostock, where he also received his PhD in Electrical Engineering for his work on multi-scale in silico modeling of deep brain stimulation.</p>
    <p>His research focuses on computational modeling of deep brain stimulation. He is particularly interested in using experimental data to validate computational models and in combining modeling with clinical data to explore dysfunctional brain circuits.</p>
    <p>If you meet Jan Philipp outside the lab, chances are he’s either on the basketball court or on the hunt for good food, and he’s always happy to talk about either one.</p>
    </div><div class="column column-1-4">
    <div class="image-block"><netstim-image data='{"src":"media/a909312aef04-payonk-1463x2048.jpg","original":"https://www.netstim.org/wp-content/uploads/2026/03/payonk-214x300.jpg","alt":"","width":214}'/></div></div><div class="column column-1-3"><article class="icon-box"><header aria-label="Icon: LinkedIn"><a aria-label="LinkedIn" class="icon-link" href="https://de.linkedin.com/in/jan-philipp-payonk-71b791279" rel="noopener noreferrer" target="_blank" title="LinkedIn"></a><h3 class="icon-heading"><a href="https://de.linkedin.com/in/jan-philipp-payonk-71b791279" rel="noopener noreferrer" target="_blank" title="LinkedIn">LinkedIn</a></h3></header></article></div></div>
