    <div class="columns"><div class="column column-3-4"><h2>Adriana Arrais</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Adriana joined the Netstim Lab in 2025 as a PhD student at the University of Cologne, working at Uniklinik Köln. With a Bachelor’s and a Master’s degree in Bioengineering from the Faculty of Engineering of the University of Porto, she is driven by a strong passion for developing impactful technologies that improve quality of life and advance healthcare provision.</p>
    <p>Her research focuses on personalized modeling of basal ganglia circuitry and on understanding how individual brain connectivity can explain variability in motor outcomes following deep brain stimulation.</p>
    <p>Beyond her enthusiasm for exploration and learning in research, Adriana enjoys physical exercise and the quiet pleasure of a well-read book, finds renewal in nature, and believes that karaoke or a good laugh with friends remains one of life’s most reliable forms of therapy.</p>
    </div><div class="column column-1-4">
