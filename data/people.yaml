    <div class="columns"><div class="column column-3-4"><h2>Patricia Zvarova</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Patricia joined the Netstim lab as a fast-track PhD student in October 2022, supported by the Einstein Center for Neuroscience fellowship. At the time, she was completing her MSc degree in Medical Neurosciences at Charité, while already working on her PhD project. She also holds a BSc (Hons) degree in Neuroscience, which she earned at the University of St Andrews in Scotland. In 2025, she moved to Cologne to continue her research as a postdoctoral fellow at the University of Cologne, employed by the Uniklinik Köln.</p>
    <p>Patricia’s research interests primarily focus on understanding and developing methods for analysing neuroimaging data. Recently, she also discovered a passion for coding. Currently, she is investigating the extent to which neuroimaging data can explain variance in clinical improvement of patients after Deep Brain Stimulation (DBS). Specifically, she is working with a sample of Parkinson’s disease patients. Her second project includes exploring the ways by which we can improve the way we study brain functional connectivity. What she enjoys the most about academia is the opportunity to delve into the knowledge that no one else might have learned before, and that there is always an opportunity to learn something new.</p>
    <p>Beyond her academic interests, Patricia enjoys reading, playing the guitar, painting, hiking, and powerlifting (a random mix of hobbies in no particular order). As a child, her favourite book was an encyclopedia of dog breeds. Feel free to quiz her on this topic – she loves dogs.</p>
    </div><div class="column column-1-4">
