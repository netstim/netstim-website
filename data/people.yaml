    <div class="columns"><div class="column column-3-4"><h2>Pepsi the dog</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Pepsi joined the NetStim Lab in April 2026 as a Mental Health Coach and Senior Scientist. While her formal background remains largely undocumented, her recent behavior suggests considerable expertise in selective obedience and subtle emotional influence.<br/>
    <br/>Her primary research interests focus on the processing of complex sensory information within the olfactory system, as well as the activation of the nucleus accumbens. She regards with particular emphasis the temporal dynamics of reward processing, most notably when induced by treats. Moreover, she is currently conducting an observational study investigating whether the mere act of watching a door influences its likelihood of opening more quickly. Preliminary results were, as expected, highly promising and have been submitted to <i>Nature</i>, pending peer review and sufficient treat-based funding.<br/>
    <br/>Outside of her scientific endeavors, Pepsi is known for her remarkable stage presence. Acting as an unofficial double of Shakira, she demonstrates exceptional hip movements and vocal expression.</p>
    </div><div class="column column-1-4">
