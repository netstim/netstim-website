    <div class="columns"><div class="column column-3-4"><h2>Ilkem Aysu Sahin</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Aysu is an MD/PhD student at NetStim, Berlin since October 2022. She has a PhD fellowship from Einstein Center of Neurosciences, where she also is a student representative. In 2025, she moved to Cologne to continue her research as a postdoctoral fellow at the University of Cologne, employed by the Uniklinik Köln.</p>
    <p>During her medical studies at Hacettepe University, Turkey, she was fascinated by the complexity of the human brain and amazed by the avenues that medical imaging has created. Her broad interests include movement disorders and connectomics. She believes in the value of neuromodulation in improving patients’ lives as well as its potential to shed light onto disease mechanisms. Her current project focuses on understanding the connections responsible for clinical improvement after deep brain stimulation for Tourette’s syndrome across different targets.</p>
    <p>After her PhD, she wants to continue her career in medicine and become a clinician scientist who is equipped with computational tools to tackle clinical questions. Brainstorming and problem solving as a team are highlights of being a scientist for her. She is passionate about high quality education and would like to improve as a teacher along her PhD. In her free time, she enjoys rock climbing and even more to cheer on climbing friends from a hammock. She is interested in art and is currently trying to learn how to draw.</p>
