    <div class="columns"><div class="column column-3-4"><h2>Ellen Younger</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Ellen joined the NetStim lab in 2026 as a postdoctoral researcher, working across the Departments of Functional and Stereotactic Neurosurgery and Neuropediatrics at the Uniklinik Köln. She holds a BPsych(Hons) and PhD in Neuroscience from Deakin University in Melbourne, Australia.</p>
    <p>Ellen’s research interests include identifying disease-related brain networks and optimising therapeutic brain stimulation, particularly in relation movement disorders. Her current project focuses on analysing deep brain stimulation (DBS) electrode placements for childhood dystonia, with the aim of improving treatment outcomes for patients with cerebral palsy and other dystonia-related conditions.</p>
    <p>Outside research, Ellen is excited to travel and enjoy exploring her new surroundings in Germany.</p>
    </div><div class="column column-1-4">
    <div class="image-block"><netstim-image data='{"src":"media/e7e57d70d846-bw_younger_ellen_00012h-1365x2048.png","original":"https://www.netstim.org/wp-content/uploads/2026/03/bw_younger_ellen_00012h-200x300.png","alt":"","width":200}'/><small class="attribution">©Michael Wodak/MedizinFotoKöln</small></div></div></div>

