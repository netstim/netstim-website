    <div class="columns"><div class="column column-3-4"><h2>Christine Paulus</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Christine joined the Netstim Lab in 2025 as a PhD student at the Faculty of Medicine at the University of Cologne, working at Uniklinik Köln and the Institute of Neuroscience and Medicine at Forschungszentrum Jülich. She holds a Bachelor’s degree in Psychology and a Research Master’s degree in Cognitive and Clinical Neuroscience from Maastricht University. She is passionate about neuromodulation, with a particular interest in symptom-specific deep brain stimulation.<br/>Her first project focuses on understanding the network dynamics underlying language disorders such as aphasia. Specifically, she investigates how brain connectivity can explain variability in language outcomes following stroke, with the goal of identifying network-based markers that predict outcomes in independent lesion and deep brain stimulation cohorts.<br/>Beyond her enthusiasm for network neuroscience and neuromodulation, Christine enjoys running, dinner evenings, and coffee dates with friends.</p>
    </div><div class="column column-1-4">
    <div class="image-block"><netstim-image data='{"src":"media/aad9d963d300-paulus_christine_lisa_marie_06035h-1365x2048.jpg","original":"https://www.netstim.org/wp-content/uploads/2025/12/paulus_christine_lisa_marie_06035h-200x300.jpg","alt":"","width":200}'/><small class="attribution">©Michael Wodak/MedizinFotoKöln</small></div></div></div>

