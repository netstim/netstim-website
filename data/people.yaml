    <div class="columns"><div class="column column-3-4"><h2>Andreas Horn</h2>
    </div></div>

    <div class="columns"><div class="column column-3-4"><p>Before bringing to life the NetStim Lab in April 2019, Andreas worked as a postdoc at the <a href="http://www.brainnetworkstim.com/">Laboratory for Brain Network Imaging and Modulation</a> headed by Prof. Michael Fox at Harvard. Prior to that, he completed an MD/PhD with Prof. Andrea Kühn in the <a href="https://neurologie.charite.de/forschung/arbeitsgruppen/bewegungsstoerungen_andrea_kuehn/">Movement Disorders and Neuromodulation Section</a> at Charité Berlin, conjointly with a scientific appointment at the laboratory of Prof. Felix Blankenburg (Bernstein Center for Computational Neuroscience / Max Planck Institute for Human Development). Andreas also holds a Dr. med., which he obtained under the guidance of Prof. Cornelius Weiller in Freiburg. As a PI he is affiliated with the PhD program of the <a href="https://www.ecn-berlin.de/">Einstein Center for Neurosciences Berlin</a> and the <a href="https://medical-neurosciences.charite.de/en/">International Graduate Program Medical Neurosciences</a> at Charité Berlin, and teaches medical as well as postgraduate-level courses.</p>
    <p>Within the scope of his scientific work, Andreas is keenly interested in the interactions between the basal ganglia and the cerebral cortex. Phylogenetically, both originate from the peduncular hypothalamus and form a system optimized in controlling our environment, first and foremost by means of action (e.g., motor output). Hence, Andreas strives to explore network connectivity and causality in this system, the human connectome and its structure-function relationship. As a clinical case of connectomics, he studies effects of deep brain stimulation (DBS) on aberrant circuitries that lead to movement disorders. These interests are often realized by furthering development of the Lead-DBS toolbox, which Andreas envisions as a collaborative platform for the refinement and scientific application of methods to study how DBS interacts with the brain.</p>
    <p>When not in the lab, Andreas may be found marveling at the invigorating powers of the coffee machine in the kitchen or hidden in the lab’s cooler eating ice cream. He may (or may not) have played in dubious rock bands with doubtful musical output back in the days, but nonetheless his love for music has lived on until today. Apart from that, Andreas also has a thing for podcasts (he even hosts one himself – it’s called <a href="http://stimulatingbrains.org/">Stimulating Brains</a>!) and the ramblings of Jerome Salinger, whom he credits as his favorite author. Ningfei Li gave him a drone once, which is amazing, but if you see Andy and his drone you better watch out because he has only been crashing into trees with it so far.</p>

