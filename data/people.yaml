# The people of Netstim: the Team page (layouts/_partials/people-page.html) and the names Home marks as lab
# members. One entry per person, in the order shown on the page; current members first, then alumni.
# Current members: the director, then postdocs, PhD students, medical and master's students, staff; within
# each group by last name.
#
#   name:         as it should appear
#   role:         the line under the name (Postdoctoral researcher, PhD student, …)
#   status:       current | alumni
#   photo:        a file in assets/media/ (leave out until there is one)
#   photo_credit: the photographer, if one must be named
#   links:        any of website, email, scholar, orcid, researchgate, github, linkedin, bluesky, x, publons,
#                 researcherid, cv (shown in that order)
#   bio:          Markdown; a blank line starts a new paragraph. Site links are written @root@path/.
#   now_at:       alumni only: where they work now (only confirmed facts)
#   page:         only for a person with a page of their own
#
# TODO(netstim): portraits for Frauke Raaff, Michael Ferres and Celine Kölsch.

- name: Andreas Horn
  role: Director
  status: current
  photo: d0b57f54e082-horn_andreas_06293h-1-1365x2048.jpg
  photo_credit: Michael Wodak/MedizinFotoKöln
  page: '@root@people/andreas-horn/'
  links:
    email: mail@andreas-horn.de
    scholar: https://scholar.google.de/citations?user=1jF_5-0AAAAJ&hl=en
    orcid: https://orcid.org/0000-0002-0695-6025
    researchgate: https://www.researchgate.net/profile/Andreas_Horn
    x: https://x.com/andreashorn_
    publons: http://publons.com/a/1317885/
    researcherid: http://researcherid.com/rid/B-8988-2017
    # TODO(netstim): the CV link is dead (404 on 2026-11-24); put the current PDF under static/ and link it here.
    # cv: http://www.andreas-horn.de/Horn_CV.pdf
  bio: |
    Andreas Horn is Director of the Institute for Network Stimulation at University Hospital Cologne and Schilling Foundation Professor of Computational Neurology at the University of Cologne. His research identifies which brain networks deep brain stimulation (DBS) acts on, to find symptom-specific targets in Parkinson’s disease, dystonia, Tourette’s syndrome, and obsessive-compulsive disorder. He created [Lead-DBS](@root@research/lead-dbs/), an open-source toolbox for DBS imaging used by research groups around the world. Before Cologne, Andreas was Associate Professor of Neurology at Harvard Medical School and directed DBS research at Brigham and Women’s Hospital. He received the Heinz Maier-Leibnitz Prize of the German Research Foundation (DFG) in 2022 and the International Brain Stimulation Early Career Award in 2025.

    When not in the lab, Andreas may be found marveling at the invigorating powers of the coffee machine in the kitchen or hidden in the lab’s cooler eating ice cream. He may (or may not) have played in dubious rock bands with doubtful musical output back in the days, but nonetheless his love for music has lived on until today. Apart from that, Andreas also has a thing for podcasts (he even hosts one himself – it’s called [Stimulating Brains](https://www.stimulatingbrains.org)!) and the ramblings of Jerome Salinger, whom he credits as his favorite author. Ningfei Li gave him a drone once, which is amazing, but if you see Andy and his drone you better watch out because he has only been crashing into trees with it so far.
- name: Jan Philipp Payonk
  role: Postdoctoral researcher
  status: current
  photo: a909312aef04-payonk-1463x2048.jpg
  links:
    linkedin: https://de.linkedin.com/in/jan-philipp-payonk-71b791279
  bio: |
    Jan Philipp joined Netstim in 2026 as a postdoctoral researcher in the Department of Functional and Stereotactic Neurosurgery at the Uniklinik Köln. He holds a Bachelor’s and a Master’s degree in Mathematics from the University of Rostock, where he also received his PhD in Electrical Engineering for his work on multi-scale in silico modeling of deep brain stimulation.

    His research focuses on computational modeling of deep brain stimulation. He is particularly interested in using experimental data to validate computational models and in combining modeling with clinical data to explore dysfunctional brain circuits.

    If you meet Jan Philipp outside the lab, chances are he’s either on the basketball court or on the hunt for good food, and he’s always happy to talk about either one.
- name: Maike Mustin
  role: Postdoctoral researcher
  status: current
  photo: a12ea1229a35-mustin_maike_06057h-1365x2048.jpg
  photo_credit: Michael Wodak/MedizinFotoKöln
  links:
    github: https://github.com/maike-mustin/
    linkedin: https://www.linkedin.com/in/maike-mustin/?originalSubdomain=de
  bio: |
    Maike joined Netstim in June 2025 as a postdoctoral researcher at Uniklinik Köln. She holds a Bachelor’s degree in Psychology from the University of Bonn and a Master’s degree in Psychology from Heinrich Heine University Düsseldorf, before conducting her doctoral research at Uniklinik Köln in the Lab for Neuromodulation and Neurorehabilitation.

    Her research investigates how brain networks reorganize after stroke and how neuroimaging and non-invasive brain stimulation — including fMRI, TMS, and TMS-EEG — can capture cortical connectivity and motor recovery.

    Outside of research, Maike is technically the human behind Pepsi, even though Pepsi insists on operating as an independent senior scientist. Come winter, she is also informally in charge of 3D-printing the lab’s Christmas decorations.
- name: Ilkem Aysu Sahin
  role: Postdoctoral researcher
  status: current
  photo: 5ef9e316d435-sahin_ilkem_aysu_06039h-1365x2048.jpg
  photo_credit: Michael Wodak/MedizinFotoKöln
  links:
    orcid: https://orcid.org/0009-0005-9951-374X
    researchgate: https://www.researchgate.net/profile/Ilkem-Sahin?ev=hdr_xprf
    linkedin: https://www.linkedin.com/in/ilkem-aysu-sahin/
  bio: |
    Aysu joined Netstim in Berlin as an MD/PhD student in October 2022. She has a PhD fellowship from Einstein Center of Neurosciences, where she also is a student representative. In 2025, she moved to Cologne to continue her research as a postdoctoral fellow at the University of Cologne, employed by the Uniklinik Köln.

    During her medical studies at Hacettepe University, Turkey, she was fascinated by the complexity of the human brain and amazed by the avenues that medical imaging has created. Her broad interests include movement disorders and connectomics. She believes in the value of neuromodulation in improving patients’ lives as well as its potential to shed light onto disease mechanisms. Her current project focuses on understanding the connections responsible for clinical improvement after deep brain stimulation for Tourette’s syndrome across different targets.

    After her PhD, she wants to continue her career in medicine and become a clinician scientist who is equipped with computational tools to tackle clinical questions. Brainstorming and problem solving as a team are highlights of being a scientist for her. She is passionate about high quality education and would like to improve as a teacher along her PhD. In her free time, she enjoys rock climbing and even more to cheer on climbing friends from a hammock. She is interested in art and is currently trying to learn how to draw.
- name: Benjamin Selaskowski
  role: Postdoctoral researcher
  status: current
  photo: be5aaff15edc-selaskowski_benjamin_netstim.jpeg
  links:
    linkedin: https://de.linkedin.com/in/benjamin-selaskowski
  bio: |
    Benjamin joined Netstim as a postdoctoral researcher in January 2026. He initially studied biomedical engineering for a few semesters before switching to psychology. During the five years he lived in the Netherlands, he completed a Bachelor of Science in Psychology at Radboud University and the Donders Institute in Nijmegen, and a Master of Science at the University of Groningen. He then worked as a neuropsychologist in the Department of Neurology at the University Hospital Göttingen, before moving to the University Hospital Bonn, where he became involved in developing and evaluating digital therapeutic methods for mental disorders and in non-invasive brain stimulation. In 2024, he received his PhD in Medical Psychology from the University of Bonn.

    At the Institute for Network Stimulation, his research is supported by DFG funding, giving him the opportunity to focus on his main area of interest, the development of personalized protocols in TMS. He is interested in how individualized brain mapping and circuit dynamics can guide stimulation targeting and improve treatment response.

    Benjamin has played tennis since the age of four, competed in teams for years and trained as a coach, though he makes it onto the court only occasionally these days. He also enjoys reading other than scientific articles, or listening to audiobooks and podcasts. He particularly enjoys traveling to France and generally to the sea. Occasionally, he tries to recall his childhood piano lessons, only to give up in frustration.
- name: Ellen Younger
  role: Postdoctoral researcher
  status: current
  photo: e7e57d70d846-bw_younger_ellen_00012h-1365x2048.png
  photo_credit: Michael Wodak/MedizinFotoKöln
  links:
    researchgate: https://www.researchgate.net/profile/Ellen-Younger-2
  bio: |
    Ellen joined Netstim in 2026 as a postdoctoral researcher, working across the Departments of Functional and Stereotactic Neurosurgery and Neuropediatrics at the Uniklinik Köln. She holds a BPsych(Hons) and PhD in Neuroscience from Deakin University in Melbourne, Australia.

    Ellen’s research interests include identifying disease-related brain networks and optimizing therapeutic brain stimulation, particularly in relation to movement disorders. Her current project focuses on analyzing deep brain stimulation (DBS) electrode placements for childhood dystonia, with the aim of improving treatment outcomes for patients with cerebral palsy and other dystonia-related conditions.

    Outside research, Ellen is excited to travel and enjoy exploring her new surroundings in Germany.
- name: Patricia Zvarova
  role: Postdoctoral researcher
  status: current
  photo: b7f8fb26f18f-zvarova_patricia_06056h-1365x2048.jpg
  photo_credit: Michael Wodak/MedizinFotoKöln
  links:
    scholar: https://scholar.google.com/citations?user=moL9DN0AAAAJ&hl=en
    orcid: https://orcid.org/0009-0004-7831-8796
    researchgate: https://www.researchgate.net/profile/Patricia-Zvarova/
    github: https://github.com/patrizvar
    linkedin: https://www.linkedin.com/in/patriciazvarova/
  bio: |
    Patricia joined Netstim as a fast-track PhD student in October 2022, supported by the Einstein Center for Neuroscience fellowship. At the time, she was completing her MSc degree in Medical Neurosciences at Charité, while already working on her PhD project. She also holds a BSc (Hons) degree in Neuroscience, which she earned at the University of St Andrews in Scotland. In 2025, she moved to Cologne to continue her research as a postdoctoral fellow at the University of Cologne, employed by the Uniklinik Köln.

    Patricia’s research interests primarily focus on understanding and developing methods for analyzing neuroimaging data. Recently, she also discovered a passion for coding. Currently, she is investigating the extent to which neuroimaging data can explain variance in clinical improvement of patients after Deep Brain Stimulation (DBS). Specifically, she is working with a sample of Parkinson’s disease patients. Her second project includes exploring the ways by which we can improve the way we study brain functional connectivity. What she enjoys the most about academia is the opportunity to delve into the knowledge that no one else might have learned before, and that there is always an opportunity to learn something new.

    Beyond her academic interests, Patricia enjoys reading, playing the guitar, painting, hiking, and powerlifting (a random mix of hobbies in no particular order). As a child, her favorite book was an encyclopedia of dog breeds. Feel free to quiz her on this topic – she loves dogs.
- name: Adriana Arrais
  role: PhD student
  status: current
  photo: f37dba08280a-arrais_adriana_06048h-1365x2048.jpg
  photo_credit: Michael Wodak/MedizinFotoKöln
  links:
    researchgate: https://www.researchgate.net/profile/Adriana-Arrais
    linkedin: https://www.linkedin.com/in/adrianarrais/?originalSubdomain=pt
  bio: |
    Adriana joined Netstim in 2025 as a PhD student at the University of Cologne, working at Uniklinik Köln. With a Bachelor’s and a Master’s degree in Bioengineering from the Faculty of Engineering of the University of Porto, she is driven by a strong passion for developing impactful technologies that improve quality of life and advance healthcare provision.

    Her research focuses on personalized modeling of basal ganglia circuitry and on understanding how individual brain connectivity can explain variability in motor outcomes following deep brain stimulation.

    Beyond her enthusiasm for exploration and learning in research, Adriana enjoys physical exercise and the quiet pleasure of a well-read book, finds renewal in nature, and believes that karaoke or a good laugh with friends remains one of life’s most reliable forms of therapy.
- name: Michael Ferres
  role: PhD student
  status: current
  bio: |
    Michael joined Netstim in 2026 as a PhD student parallel to his training as a children’s psychotherapist at the UKK. He completed his master’s degree in psychology at the University of Bonn under Benjamin Selaskowski and joined his project to continue working on connectivity analyses in the context of TMS intervention.

    His research interests encompass TMS stimulation targets and possible individualization, TMS treatment effects and identifying lifespan differences in impairment of cognitive control.

    Besides his interest in clinical psychology, Michael enjoys football, swimming, playing and crafting the classical guitar and cooking authentic Italian dishes.
- name: Celine Kölsch
  role: PhD student
  status: current
  bio: |
    Celine joined Netstim in August 2026, where she supports a clinical study investigating personalized transcranial magnetic stimulation in adults with attention-deficit/hyperactivity disorder. She holds a Bachelor of Science and a Master of Science in Psychology from the University of Trier and is currently completing her training as a psychotherapist in Cologne alongside her research.

    In parallel, Celine is pursuing her PhD at the University of Oldenburg, where her research focuses on the safety, tolerability, and adverse effects of non-invasive brain stimulation in the treatment of mental disorders.

    Despite what her last name might suggest, Celine is not originally from Cologne. She grew up in a small wine village along the Moselle and even served as a wine princess there. Outside of research and clinical work, she enjoys fitness and staying active, traveling, and spending time with friends and family.
- name: Christine Paulus
  role: PhD student
  status: current
  photo: aad9d963d300-paulus_christine_lisa_marie_06035h-1365x2048.jpg
  photo_credit: Michael Wodak/MedizinFotoKöln
  links:
    linkedin: https://www.linkedin.com/in/christine-paulus-689a56263/details/education/
  bio: |
    Christine joined Netstim in 2025 as a PhD student at the Faculty of Medicine at the University of Cologne, working at Uniklinik Köln and the Institute of Neuroscience and Medicine at Forschungszentrum Jülich. She holds a Bachelor’s degree in Psychology and a Research Master’s degree in Cognitive and Clinical Neuroscience from Maastricht University. She is passionate about neuromodulation, with a particular interest in symptom-specific deep brain stimulation.

    Her first project focuses on understanding the network dynamics underlying language disorders such as aphasia. Specifically, she investigates how brain connectivity can explain variability in language outcomes following stroke, with the goal of identifying network-based markers that predict outcomes in independent lesion and deep brain stimulation cohorts.

    Beyond her enthusiasm for network neuroscience and neuromodulation, Christine enjoys running, dinner evenings, and coffee dates with friends.
- name: Frauke Raaff
  role: Administrative executive
  status: current
  links:
    linkedin: https://de.linkedin.com/in/frauke-raaff-8882a6226
  bio: |
    Frauke joined Netstim in 2026 as the administrative executive, working at Uniklinik Köln. She holds a Bachelor of Arts in Literary and Linguistic Studies from RWTH Aachen University and is also a Certified Foreign Language Correspondent in English. After working as a research assistant at RWTH centralized Biomaterial Bank Aachen and Schneider C. Lab (Gastroenterology) at Uniklinik Aachen for almost 3.5 years and completing interdisciplinary modules in Neurolinguistics and Neuropsychology as part of her course of studies, she is looking forward to the upcoming years at Netstim.

    When Frauke is not busy writing e-mails and maintaining office operations, she enjoys reading a good book, exploring the outdoors with her dog Nils – a Corgi-Jack Russell Terrier Mix – and learning new languages. Recently, she is trying to pick up Italian again, which she started learning back in High School. If you want to really get her talking, ask her about Doctor Who. She’s been a Whovian for nearly two decades and it’s her comfort show.
- name: Lara Krüger
  role: Master’s student
  status: current
  photo: db52efc3eae3-a49406be-7492-426b-b5e8-0415cc9b85a5-1536x1022.jpg
  bio: |
    Lara joined Netstim in March 2026 for a research rotation and her Master’s thesis as part of her M.Sc. in Clinical and Experimental Neurosciences at the University of Cologne. She previously obtained her Bachelor’s degree in Psychology (cum laude) from Radboud University in the Netherlands.

    Her research interests lie in neurological and psychiatric disorders and how neural networks differ between healthy and pathological states. She plans to pursue a PhD in Neuroscience, after completing her Master’s degree.

    In her free time, she can often be found (not entirely successfully) trying to relearn French, enjoying dinner parties with friends, or watching handball. She enjoys exploring new sports places and appreciates a good espresso – occasionally in the form of an espresso martini.
- name: Helen Friedrich
  role: MD student
  status: current
  photo: 460a43f6a7f8-Helen_Friedrich.jpg
  links:
    researchgate: https://www.researchgate.net/profile/Helen-Friedrich
  bio: |
    Helen is an MD student who joined the lab in Boston in April 2023, where she focuses on her MD thesis project aimed at creating a detailed brain atlas for DBS imaging.

    Her journey into medicine began with a foundation in psychology, where her work with neuropsychiatric patients sparked a profound interest in neurology and functional neuroanatomy. This experience led her to explore imaging research with the goal to bridge clinical practice with scientific inquiry. In her bachelor’s thesis, she used fMRI and eye-tracking to probe brain networks involved in social attention.

    Working with neuropsychiatric patients was a key motivator in her decision to transition into medical school. She pursues an additional degree in translational medicine to lay the foundation for a clinician-scientist career. Her favorite topics are anatomy and intensive care medicine.

    Helen is excited to immerse in Boston’s academic environment and is committed to making a meaningful contribution to the field through her atlas project.

    Beyond her interest in the brain, Helen is passionate about interior design and loves spending time in the mountains, either hiking or skiing.
- name: Richard Demann
  role: Medical student
  status: current
  photo: 32a303f35201-IMG_7312-1-1536x1536.jpeg
  links:
    linkedin: https://de.linkedin.com/in/richard-demann-40791b213
  bio: |
    Richard joined Netstim in November 2025. He is a medical student at the University of Cologne and previously spent time in labs at TU Munich, UCSF, and the Mayo Clinic.

    Outside the lab, he enjoys reading, podcasts, and good food, and is slowly being buried by his ever-growing mountain of Anki reviews.
- name: Pepsi the dog
  role: Mental health coach
  status: current
  photo: 1c6cdb003f13-Pepsi.png
  links:
    linkedin: https://www.linkedin.com/in/pepsi-the-dog-542b6b403/
  bio: |
    Pepsi joined Netstim in April 2026 as a Mental Health Coach and Senior Scientist. While her formal background remains largely undocumented, her recent behavior suggests considerable expertise in selective obedience and subtle emotional influence.

    Her primary research interests focus on the processing of complex sensory information within the olfactory system, as well as the activation of the nucleus accumbens. She regards with particular emphasis the temporal dynamics of reward processing, most notably when induced by treats. Moreover, she is currently conducting an observational study investigating whether the mere act of watching a door influences its likelihood of opening more quickly. Preliminary results were, as expected, highly promising and have been submitted to *Nature*, pending peer review and sufficient treat-based funding.

    Outside of her scientific endeavors, Pepsi is known for her remarkable stage presence. Acting as an unofficial double of Shakira, she demonstrates exceptional hip movements and vocal expression.

