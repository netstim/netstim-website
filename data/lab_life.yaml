title: Lab life
text: Good science takes serious focus, good coffee, and people you actually enjoy spending the day with. Between neuroimaging pipelines and paper drafts, we’re a mix of neuroscientists, clinicians, engineers, and one opinionated lab dog who rarely turn down cake, an afternoon outside, or an excuse to dress up in Cologne.
