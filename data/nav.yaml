# The header menu (layouts/_partials/nav.html). Each item is a link: `title` and `url`.
#   children:  the pages under the item. With children the item opens a sheet under the header that
#              lists them in large type (on a phone: a group that unfolds). List the item's own page
#              first if it should appear there too. Each child has `title`, `url` and an optional
#              one-line `text` (a few plain words, shown under the title in the desktop sheet). An
#              address that starts with http is marked as an outside link. Leave `children` out for a
#              plain link.
#   also:      other addresses that light up the item (its children's addresses already do).
#   posts:     true lights the item on every news post.
main:
- title: Research
  url: '@root@research/'
  children:
  - title: Overview
    url: '@root@research/'
    text: Research areas and software
  - title: Deep Brain Stimulation
    url: '@root@research/deep-brain-stimulation/'
    text: Mapping stimulated brain circuits
  - title: Normative Connectomes
    url: '@root@research/normative-connectomes/'
    text: Group-average connectomes from large MRI cohorts
  - title: Lead-DBS
    url: '@root@research/lead-dbs/'
    text: Open-source toolbox for electrode reconstruction
- title: Publications
  url: '@root@publications/'
  children:
  - title: Papers
    url: '@root@publications/'
    text: Listed by year
  - title: Posters
    url: '@root@publications/posters/'
    text: Conference posters
  - title: Talks
    url: '@root@publications/talks/'
    text: Recorded talks and lectures
  - title: Book
    url: '@root@book/'
    text: Connectomic Deep Brain Stimulation
- title: People
  url: '@root@people/'
  children:
  - title: Team
    url: '@root@people/'
    text: Current members and alumni
  - title: Jobs
    url: '@root@jobs/'
    text: Open positions
- title: News
  url: '@root@news/'
  posts: true
- title: Community
  url: '@root@community/'
  children:
  - title: Overview
    url: '@root@community/'
    text: Journal club, podcast, and workshops
  - title: Stimu-Latte
    url: '@root@stimu-latte/'
    text: Monthly journal club
  - title: Stimulating Brains
    url: 'https://www.stimulatingbrains.org'
    text: Podcast and talk series

logo: media/0a5bca3040a8-netstim_institute_logo_en-1.png
logo_light: media/netstim-logo-light.png
logo_alt: Institute for Network Stimulation

# The footer (layouts/_partials/footer.html): the address comes from data/contact.yaml; here are the
# three profiles shown as icons (`icon`: bluesky, linkedin or github) and the links of the last line.
social:
- {title: Bluesky, icon: bluesky, url: 'https://bsky.app/profile/netstim.org'}
- {title: LinkedIn, icon: linkedin, url: 'https://www.linkedin.com/company/institute-for-network-stimulation/'}
- {title: GitHub, icon: github, url: 'https://github.com/netstim'}

footer:
- title: For lab members
  url: '@root@internal/'
- title: Imprint
  url: '@root@imprint/'
- title: Privacy
  url: '@root@privacy/'
