# Selected papers: the short list at the top of the Publications page, in this order (newest first, as the
# full list below it). Each entry is the Zotero `key` of a paper in data/publications.yaml (journal and year
# come from there), and:
#   title    the published title, where the Zotero one differs
#   image    a picture from that very paper (its key figure, or the journal cover it got), in assets/media/.
#            Shown 3:2 and cropped to fill, at the left of the paper's row (240px wide; 104px on a phone);
#            never a picture that only looks similar. A paper without one is not shown.
#   whole    true shows the picture uncropped on the soft-gray frame (a journal cover, which is upright)
#   drawing  true for a figure drawn on white: it is blended into its frame, and the dark theme turns its
#            lightness around (the colors keep their hue), as on the Research pages.
# Each downloaded figure has a `# source:` line with the figure's address and its license.
# Every paper is a row of its own, so any number works; six to nine read well. The lab's own work, across
# its topics.

