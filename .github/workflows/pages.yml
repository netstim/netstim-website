name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netstim-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install verified Hugo extended
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL -O "$base/$deb" -O "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $deb\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          sudo dpkg -i "$deb"
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the noindex preview
        env:
          HUGO_PARAMS_PREVIEW: "true"
          PREVIEW_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          hugo --gc --minify --baseURL "$PREVIEW_URL"
          python3 .github/scripts/check-site.py public "$PREVIEW_URL"
          python3 .github/scripts/check-design.py
          python3 .github/scripts/check-css-used.py public
          python3 -m venv "$RUNNER_TEMP/netstim-python"
          "$RUNNER_TEMP/netstim-python/bin/pip" install beautifulsoup4==4.13.5
          "$RUNNER_TEMP/netstim-python/bin/python" .github/scripts/check-copy.py public --prefix /netstim-website/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check browser interactions under the Pages base path
        env:
          PREVIEW_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          node .github/scripts/check-interactions.mjs public "$PREVIEW_URL"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
